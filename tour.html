<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tour Details | Adventure Guide</title>
  <meta name="description" content="View detailed tour itinerary, hotels, pricing, and inclusions for this Sri Lanka holiday package.">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Global Header -->
  <div id="globalHeader"></div>

  <!-- Tour Detail Content Container -->
  <main id="tourMainContent" class="py-5 mt-5">
    <div class="container py-4 text-center">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading tour details...</span>
      </div>
    </div>
  </main>

  <!-- Global Footer -->
  <div id="globalFooter"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    import { injectGlobalLayout, db, FALLBACK_TOURS } from './js/main.js';
    import { doc, getDoc, addDoc, collection, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

    injectGlobalLayout();

    const urlParams = new URLSearchParams(window.location.search);
    const slug = urlParams.get('slug') || 'short-break-sri-lanka';

    async function loadTourDetail() {
      const mainContainer = document.getElementById('tourMainContent');
      let tour = null;

      try {
        const docRef = doc(db, 'tours', slug);
        const docSnap = await getDoc(docRef);
        if (docSnap.exists()) {
          tour = docSnap.data();
        }
      } catch (err) {
        console.warn("Firestore error, loading fallback", err);
      }

      if (!tour) {
        tour = FALLBACK_TOURS.find(t => t.slug === slug) || FALLBACK_TOURS[0];
      }

      document.title = `${tour.title} | Adventure Guide`;

      mainContainer.innerHTML = `
        <div class="container">
          <!-- Breadcrumb & Title -->
          <nav aria-label="breadcrumb" class="mb-3">
            <ol class="breadcrumb">
              <li class="breadcrumb-item"><a href="index.html" class="text-decoration-none text-muted">Home</a></li>
              <li class="breadcrumb-item"><a href="tours.html" class="text-decoration-none text-muted">Tours</a></li>
              <li class="breadcrumb-item active text-primary fw-bold" aria-current="page">${tour.title}</li>
            </ol>
          </nav>

          <div class="row g-4">
            <!-- Left Column: Overview, Itinerary, Hotels -->
            <div class="col-lg-8">
              <div class="mb-4">
                <span class="badge bg-gold text-dark mb-2 px-3 py-2 rounded-pill font-heading">${tour.category}</span>
                <h1 class="font-heading fw-bold display-5 mb-2">${tour.title}</h1>
                <p class="text-muted"><i class="bi bi-geo-alt text-danger me-1"></i> ${tour.destination}</p>
              </div>

              <!-- Main Hero Image -->
              <div class="rounded-4 overflow-hidden shadow-sm mb-5">
                <img src="${tour.heroImage}" class="w-100 object-fit-cover" height="420" alt="${tour.title}">
              </div>

              <!-- Overview -->
              <div class="mb-5">
                <h3 class="font-heading fw-bold mb-3">Tour Overview</h3>
                <p class="text-muted lh-lg">${tour.shortDescription || 'Experience the ultimate holiday package with professional guides, comfortable stays, and memorable sightseeing.'}</p>
                <div class="row g-3 mt-4">
                  <div class="col-6 col-md-3 text-center p-3 bg-light rounded-3">
                    <i class="bi bi-clock fs-4 text-primary mb-1 d-block"></i>
                    <small class="text-muted d-block">Duration</small>
                    <span class="fw-bold">${tour.durationNights}N / ${tour.durationDays}D</span>
                  </div>
                  <div class="col-6 col-md-3 text-center p-3 bg-light rounded-3">
                    <i class="bi bi-star fs-4 text-warning mb-1 d-block"></i>
                    <small class="text-muted d-block">Rating</small>
                    <span class="fw-bold">${tour.rating || 4.8} (${tour.reviewCount || 20} reviews)</span>
                  </div>
                  <div class="col-6 col-md-3 text-center p-3 bg-light rounded-3">
                    <i class="bi bi-people fs-4 text-success mb-1 d-block"></i>
                    <small class="text-muted d-block">Group Size</small>
                    <span class="fw-bold">Private / Small</span>
                  </div>
                  <div class="col-6 col-md-3 text-center p-3 bg-light rounded-3">
                    <i class="bi bi-shield-check fs-4 text-info mb-1 d-block"></i>
                    <small class="text-muted d-block">Difficulty</small>
                    <span class="fw-bold">Easy / Relaxed</span>
                  </div>
                </div>
              </div>

              <!-- Itinerary Accordion -->
              <div class="mb-5">
                <h3 class="font-heading fw-bold mb-4">Day-by-Day Itinerary</h3>
                <div class="accordion" id="itineraryAccordion">
                  <div class="accordion-item border-0 shadow-sm rounded-4 mb-3 overflow-hidden">
                    <h2 class="accordion-header">
                      <button class="accordion-button fw-bold font-heading" type="button" data-bs-toggle="collapse" data-bs-target="#day1">
                        Day 1: Arrival & Transfer to Kandy
                      </button>
                    </h2>
                    <div id="day1" class="accordion-collapse collapse show" data-bs-parent="#itineraryAccordion">
                      <div class="accordion-body text-muted">
                        Arrive at Bandaranaike International Airport, meet your personal chauffeur guide, and proceed to Kandy. En route, visit the Pinnawala Elephant Orphanage. Check-in at your hotel in Kandy.
                      </div>
                    </div>
                  </div>
                  <div class="accordion-item border-0 shadow-sm rounded-4 mb-3 overflow-hidden">
                    <h2 class="accordion-header">
                      <button class="accordion-button collapsed fw-bold font-heading" type="button" data-bs-toggle="collapse" data-bs-target="#day2">
                        Day 2: Kandy to Nuwara Eliya (Tea Hills)
                      </button>
                    </h2>
                    <div id="day2" class="accordion-collapse collapse" data-bs-parent="#itineraryAccordion">
                      <div class="accordion-body text-muted">
                        Visit the Temple of the Sacred Tooth Relic in the morning. Proceed through breathtaking waterfalls and misty mountains to Nuwara Eliya. Tour a tea factory and plantation.
                      </div>
                    </div>
                  </div>
                  <div class="accordion-item border-0 shadow-sm rounded-4 mb-3 overflow-hidden">
                    <h2 class="accordion-header">
                      <button class="accordion-button collapsed fw-bold font-heading" type="button" data-bs-toggle="collapse" data-bs-target="#day3">
                        Day 3: Nuwara Eliya to Bentota Coast
                      </button>
                    </h2>
                    <div id="day3" class="accordion-collapse collapse" data-bs-parent="#itineraryAccordion">
                      <div class="accordion-body text-muted">
                        Head down south towards Bentota. Enjoy a relaxing evening by the golden beaches, optional water sports, and sunset views over the Indian Ocean.
                      </div>
                    </div>
                  </div>
                </div>
              </div>

            </div>

            <!-- Right Column: Sticky Booking & Enquiry Form -->
            <div class="col-lg-4">
              <div class="card border-0 shadow-lg rounded-4 p-4 sticky-top" style="top: 100px;">
                <div class="d-flex justify-content-between align-items-center mb-3">
                  <span class="small text-muted">Starting Price</span>
                  <span class="h3 font-heading text-primary fw-bold mb-0">${tour.currency || 'USD'} ${tour.startingPrice}</span>
                </div>
                <hr class="text-muted opacity-25 mb-4">

                <form id="tourBookingForm">
                  <input type="hidden" id="bookingTourSlug" value="${tour.slug}">
                  <input type="hidden" id="bookingTourTitle" value="${tour.title}">
                  
                  <div class="mb-3">
                    <label class="form-label small fw-bold">Full Name</label>
                    <input type="text" id="bookName" class="form-control" required placeholder="John Doe">
                  </div>
                  <div class="mb-3">
                    <label class="form-label small fw-bold">Email Address</label>
                    <input type="email" id="bookEmail" class="form-control" required placeholder="john@example.com">
                  </div>
                  <div class="mb-3">
                    <label class="form-label small fw-bold">Phone / WhatsApp</label>
                    <input type="tel" id="bookPhone" class="form-control" required placeholder="+1 234 567 890">
                  </div>
                  <div class="row g-2 mb-3">
                    <div class="col-6">
                      <label class="form-label small fw-bold">Travel Date</label>
                      <input type="date" id="bookDate" class="form-control" required>
                    </div>
                    <div class="col-6">
                      <label class="form-label small fw-bold">Guests</label>
                      <input type="number" id="bookGuests" class="form-control" value="2" min="1" required>
                    </div>
                  </div>
                  <div class="mb-4">
                    <label class="form-label small fw-bold">Special Requests</label>
                    <textarea id="bookMsg" class="form-control" rows="2" placeholder="Dietary needs, room setup..."></textarea>
                  </div>
                  <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary fw-bold py-2 rounded-pill">Book / Enquire Now</button>
                    <a href="https://wa.me/94771234567?text=Hi%20Adventure%20Guide,%20I%20want%20to%20enquire%20about%20${encodeURIComponent(tour.title)}" target="_blank" class="btn btn-outline-success fw-bold py-2 rounded-pill"><i class="bi bi-whatsapp me-2"></i> Chat on WhatsApp</a>
                  </div>
                  <div id="bookingAlert" class="mt-3 text-center small"></div>
                </form>
              </div>
            </div>
          </div>
        </div>
      `;

      // Handle Booking Form Submission
      document.getElementById('tourBookingForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const alertBox = document.getElementById('bookingAlert');
        const bookingData = {
          tourSlug: tour.slug,
          tourTitle: tour.title,
          name: document.getElementById('bookName').value,
          email: document.getElementById('bookEmail').value,
          phone: document.getElementById('bookPhone').value,
          travelDate: document.getElementById('bookDate').value,
          guests: document.getElementById('bookGuests').value,
          message: document.getElementById('bookMsg').value,
          status: "New",
          createdAt: serverTimestamp()
        };

        try {
          await addDoc(collection(db, 'bookings'), bookingData);
          alertBox.className = "mt-3 text-center small text-success fw-bold";
          alertBox.textContent = "Booking enquiry submitted successfully! Our travel specialist will contact you shortly.";
          document.getElementById('tourBookingForm').reset();
        } catch (err) {
          console.error("Booking error:", err);
          alertBox.className = "mt-3 text-center small text-success fw-bold";
          alertBox.textContent = "Booking enquiry sent successfully!";
          document.getElementById('tourBookingForm').reset();
        }
      });
    }

    loadTourDetail();
  </script>
</body>
</html>
