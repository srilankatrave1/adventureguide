<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sri Lanka Tour Packages | Adventure Guide</title>
  <meta name="description" content="Browse our comprehensive selection of Sri Lanka tour packages. Filter by budget, duration, and themes like honeymoon, wildlife, and family holidays.">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Global Header -->
  <div id="globalHeader"></div>

  <!-- Page Header Banner -->
  <header class="page-banner bg-dark text-white py-5 position-relative">
    <div class="container py-5 text-center position-relative z-2">
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb justify-content-center mb-2">
          <li class="breadcrumb-item"><a href="index.html" class="text-gold text-decoration-none">Home</a></li>
          <li class="breadcrumb-item active text-white" aria-current="page">Tour Packages</li>
        </ol>
      </nav>
      <h1 class="display-4 font-heading fw-bold mb-3">Sri Lanka Tour Packages</h1>
      <p class="lead text-muted max-w-700 mx-auto">The Pearl of the Indian Ocean, Sri Lanka is an irresistible mix of pristine beaches, colonial heritage, impenetrable forests and magnificent temples.</p>
    </div>
  </header>

  <!-- Theme Icons Bar -->
  <section class="py-3 bg-light border-bottom">
    <div class="container">
      <div class="d-flex overflow-auto gap-3 pb-2 scrollbar-none justify-content-lg-center">
        <button class="btn btn-outline-dark rounded-pill px-4 filter-theme-btn active" data-category="">All Packages</button>
        <button class="btn btn-outline-dark rounded-pill px-4 filter-theme-btn" data-category="Honeymoon">Honeymoon</button>
        <button class="btn btn-outline-dark rounded-pill px-4 filter-theme-btn" data-category="Family">Family</button>
        <button class="btn btn-outline-dark rounded-pill px-4 filter-theme-btn" data-category="Wildlife">Wildlife</button>
        <button class="btn btn-outline-dark rounded-pill px-4 filter-theme-btn" data-category="Cultural">Cultural</button>
        <button class="btn btn-outline-dark rounded-pill px-4 filter-theme-btn" data-category="Beach">Beach</button>
      </div>
    </div>
  </section>

  <!-- Main Listing Section -->
  <section class="py-5">
    <div class="container">
      <div class="row g-4">
        
        <!-- Left Sidebar Filters -->
        <div class="col-lg-3">
          <div class="card border-0 shadow-sm rounded-4 p-4 sticky-top" style="top: 100px;">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <h5 class="font-heading fw-bold mb-0">Filters</h5>
              <button id="resetFilters" class="btn btn-link btn-sm text-decoration-none text-muted p-0">Reset All</button>
            </div>
            <hr class="text-muted opacity-25 mb-4">

            <!-- Search Keyword -->
            <div class="mb-4">
              <label class="form-label small fw-bold">Search Keywords</label>
              <input type="text" id="filterKeyword" class="form-control form-control-sm" placeholder="e.g. Kandy, Yala...">
            </div>

            <!-- Price Range -->
            <div class="mb-4">
              <label class="form-label small fw-bold">Max Budget: $<span id="priceVal">3000</span></label>
              <input type="range" class="form-range" id="filterPrice" min="500" max="5000" step="100" value="3000">
            </div>

            <!-- Duration -->
            <div class="mb-4">
              <label class="form-label small fw-bold">Max Duration (Days)</label>
              <input type="range" class="form-range" id="filterDuration" min="1" max="15" step="1" value="10">
            </div>

            <!-- Sort By -->
            <div class="mb-3">
              <label class="form-label small fw-bold">Sort By</label>
              <select id="sortBy" class="form-select form-select-sm">
                <option value="popular">Most Popular</option>
                <option value="price-low">Price: Low to High</option>
                <option value="price-high">Price: High to Low</option>
                <option value="duration">Duration</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Tours Grid Area -->
        <div class="col-lg-9">
          <div class="d-flex justify-content-between align-items-center mb-4">
            <p class="text-muted mb-0">Showing <span id="resultsCount" class="fw-bold text-dark">0</span> trips found</p>
          </div>

          <div id="toursListingGrid" class="row g-4">
            <!-- Dynamic Tours -->
          </div>
        </div>

      </div>
    </div>
  </section>

  <!-- Global Footer -->
  <div id="globalFooter"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    import { injectGlobalLayout, db, FALLBACK_TOURS } from './js/main.js';
    import { collection, getDocs } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

    injectGlobalLayout();

    let allTours = [];

    async function initToursPage() {
      try {
        const snapshot = await getDocs(collection(db, 'tours'));
        snapshot.forEach(doc => {
          allTours.push({ slug: doc.id, ...doc.data() });
        });
      } catch (err) {
        console.warn("Using fallback tours", err);
      }

      if (allTours.length === 0) {
        allTours = FALLBACK_TOURS;
      }

      // Check URL parameters if redirected from homepage search
      const urlParams = new URLSearchParams(window.location.search);
      const categoryParam = urlParams.get('category');
      const destinationParam = urlParams.get('destination');

      if (categoryParam) {
        const btn = document.querySelector(`[data-category="${categoryParam}"]`);
        if (btn) {
          document.querySelectorAll('.filter-theme-btn').forEach(b => b.classList.remove('active', 'btn-dark'));
          btn.classList.add('active', 'btn-dark');
        }
      }

      renderTours();
      setupEventListeners();
    }

    function renderTours() {
      const keyword = document.getElementById('filterKeyword').value.toLowerCase();
      const maxPrice = Number(document.getElementById('filterPrice').value);
      const maxDuration = Number(document.getElementById('filterDuration').value);
      const activeCategoryBtn = document.querySelector('.filter-theme-btn.active');
      const selectedCategory = activeCategoryBtn ? activeCategoryBtn.getAttribute('data-category') : '';
      const sortBy = document.getElementById('sortBy').value;

      document.getElementById('priceVal').textContent = maxPrice;

      let filtered = allTours.filter(tour => {
        let matchKeyword = !keyword || tour.title.toLowerCase().includes(keyword) || tour.destination.toLowerCase().includes(keyword);
        let matchPrice = (tour.startingPrice || 1000) <= maxPrice;
        let matchDuration = (tour.durationDays || 5) <= maxDuration;
        let matchCategory = !selectedCategory || tour.category === selectedCategory;
        return matchKeyword && matchPrice && matchDuration && matchCategory;
      });

      // Sorting
      if (sortBy === 'price-low') filtered.sort((a,b) => a.startingPrice - b.startingPrice);
      else if (sortBy === 'price-high') filtered.sort((a,b) => b.startingPrice - a.startingPrice);
      else if (sortBy === 'duration') filtered.sort((a,b) => a.durationDays - b.durationDays);

      document.getElementById('resultsCount').textContent = filtered.length;

      const grid = document.getElementById('toursListingGrid');
      if (filtered.length === 0) {
        grid.innerHTML = `<div class="col-12 text-center py-5"><h4 class="font-heading text-muted">No tour packages match your filters.</h4><button class="btn btn-primary mt-3 rounded-pill" id="clearFiltersBtn">Clear Filters</button></div>`;
        document.getElementById('clearFiltersBtn')?.addEventListener('click', resetAllFilters);
        return;
      }

      grid.innerHTML = filtered.map(tour => `
        <div class="col-md-6 col-xl-4">
          <div class="card tour-card border-0 shadow-sm rounded-4 overflow-hidden h-100 bg-white">
            <div class="position-relative">
              <img src="${tour.heroImage}" class="card-img-top object-fit-cover" height="220" alt="${tour.title}">
              <span class="badge bg-gold text-dark position-absolute top-0 start-0 m-3 px-3 py-2 rounded-pill font-heading">${tour.durationNights}N / ${tour.durationDays}D</span>
              <span class="badge bg-dark bg-opacity-75 text-white position-absolute top-0 end-0 m-3 px-3 py-2 rounded-pill">${tour.category}</span>
            </div>
            <div class="card-body p-4 d-flex flex-column">
              <div class="d-flex align-items-center mb-2 text-warning small">
                <i class="bi bi-star-fill me-1"></i> <span class="fw-bold text-dark me-2">${tour.rating || 4.8}</span>
                <span class="text-muted">(${tour.reviewCount || 15} reviews)</span>
              </div>
              <h4 class="font-heading h5 fw-bold mb-2">${tour.title}</h4>
              <p class="text-muted small mb-3"><i class="bi bi-geo-alt text-danger me-1"></i> ${tour.destination}</p>
              <div class="d-flex align-items-center justify-content-between mt-auto pt-3 border-top">
                <div>
                  <span class="small text-muted d-block">Starting from</span>
                  <span class="h5 font-heading text-primary fw-bold mb-0">${tour.currency || 'USD'} ${tour.startingPrice}</span>
                </div>
                <a href="tour.html?slug=${tour.slug}" class="btn btn-primary btn-sm rounded-pill px-4">View Details</a>
              </div>
            </div>
          </div>
        </div>
      `).join('');
    }

    function setupEventListeners() {
      document.getElementById('filterKeyword').addEventListener('input', renderTours);
      document.getElementById('filterPrice').addEventListener('input', renderTours);
      document.getElementById('filterDuration').addEventListener('input', renderTours);
      document.getElementById('sortBy').addEventListener('change', renderTours);

      document.querySelectorAll('.filter-theme-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          document.querySelectorAll('.filter-theme-btn').forEach(b => b.classList.remove('active', 'btn-dark'));
          b.classList.add('btn-outline-dark');
          e.target.classList.add('active', 'btn-dark');
          e.target.classList.remove('btn-outline-dark');
          renderTours();
        });
      });

      document.getElementById('resetFilters').addEventListener('click', resetAllFilters);
    }

    function resetAllFilters() {
      document.getElementById('filterKeyword').value = '';
      document.getElementById('filterPrice').value = 3000;
      document.getElementById('filterDuration').value = 10;
      document.getElementById('sortBy').value = 'popular';
      document.querySelectorAll('.filter-theme-btn').forEach((b, i) => {
        if (i === 0) { b.classList.add('active', 'btn-dark'); b.classList.remove('btn-outline-dark'); }
        else { b.classList.remove('active', 'btn-dark'); b.classList.add('btn-outline-dark'); }
      });
      renderTours();
    }

    initToursPage();
  </script>
</body>
</html>
